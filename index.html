<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squad Goals</title>
    <meta name="description" content="Squad Goals: Premier League and Champions League live scores, tables, fixtures and top scorers, updated match by match." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Buy Me a Coffee floating button. Loaded async and last so a slow or
         blocked CDN never delays the app itself. It parks bottom right, which
         is where the mobile bottom nav lives, so styles.css lifts it clear of
         the nav below 760px. -->
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="henderjm"
      data-description="Support me on Buy me a coffee!"
      data-message=""
      data-color="#40DCA5"
      data-position="Right"
      data-x_margin="18"
      data-y_margin="18"
      async
    ></script>
  </body>
</html>
