# Cron starts the chain; self-dispatch keeps it running because scheduled
# starts have been unreliable. The concurrency group and queued-run check
# prevent overlapping feeders. Live runs trade two minutes of the old idle
# pause for two more score passes, preserving the detail-refresh cadence.
name: Feed live match detail

on:
  schedule:
    - cron: "*/5 11-22 * * *"
  workflow_dispatch:

concurrency:
  group: live-detail-feeder
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  feed:
    if: ${{ vars.SCORE_READ_ORIGIN == '' }}
    runs-on: ubuntu-latest
    # Six-minute live loop plus restart pause and setup headroom.
    timeout-minutes: 12
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Feed live match detail
        id: feed
        run: node scripts/feed-live-details.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DETAIL_INGEST_TOKEN: ${{ secrets.DETAIL_INGEST_TOKEN }}
          API_FOOTBALL_COMPETITIONS: "PL:2026,CL:2026"

      # Keep the short pause while live (or fixture discovery is uncertain).
      # Idle runs retain the slower cadence. Always re-arm after a failed step.
      - name: Re-arm the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REARM_DELAY_SECONDS: ${{ steps.feed.outputs.rearm_delay_seconds || '180' }}
          FEEDER_FOLLOW_UP: ${{ steps.feed.outputs.follow_up_needed || 'false' }}
        run: |
          if ! node scripts/live-feeder-window.mjs; then
            echo "no match follow-up needed outside daytime hours, or the overnight retry limit was reached"
            exit 0
          fi
          sleep "$REARM_DELAY_SECONDS"
          if ! node scripts/live-feeder-window.mjs; then
            echo "the restart window ended during the pause"
            exit 0
          fi
          queued=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/live-detail-feeder.yml/runs?status=queued&per_page=1" --jq '.total_count' || echo 0)
          if [ "${queued:-0}" -gt 0 ]; then
            echo "a run is already queued; not doubling the chain"
            exit 0
          fi
          gh workflow run live-detail-feeder.yml --ref main
          echo "re-armed the next feeder run"
