name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Static fallback refreshes for the 12-hour match window only. The Worker owns
    # minute-live delivery; burning API requests on overnight Pages deploys adds no
    # value. GitHub schedules are UTC and best effort.
    - cron: "0 11-22 * * *"
  workflow_dispatch:
    inputs:
      force_player_refresh:
        description: "Re-fetch the fantasy player pool even if it is still fresh"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history rather than the default depth-1 clone. The build
          # derives each sitemap lastmod from the commit that last touched the
          # content (scripts/build-seo-pages.mjs); a shallow clone usually does
          # not contain that commit, so every URL would quietly fall back to
          # the build date. This repo is a few MiB, so the cost is negligible.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: npm ci
      - name: Build API-Football client
        run: go build -o /tmp/squad-goals-api ./cmd/api-football
      # Persist fetched match detail across runs. Each deploy checks out main fresh, so
      # without this the Golden Boot tally only ever sees the committed seed files plus
      # whatever one run can re-fetch - matches that fail or get
      # starved that run vanish from the board, so scorer totals chronically undercount.
      # An accumulating cache (unique key + prefix restore-keys) restores the latest set,
      # the fetch script fetches only matches it does not already hold final detail for,
      # and the post-job save writes the grown set back. Coverage converges to complete.
      - name: Restore accumulated match detail
        uses: actions/cache@v4
        with:
          path: |
            data/*/matches
            data/PL/players.json
          key: api-football-data-2026-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            api-football-data-2026-
      # Scheduled and manual runs only, never a push.
      #
      # A push changes CODE, not match data, and the cache restore above already
      # carries the previous bake's data into the build, so a deploy ships fresh
      # code against data at most an hour old. Re-fetching on every push bought
      # nothing and was expensive: one bake costs roughly 180 upstream calls
      # against a 7,500/day plan, so five deploys in a day spent about 900
      # calls, 12% of the allowance, refreshing data nobody had asked for. Worse,
      # it coupled spend to deploy frequency, so a busy development day could
      # exhaust the allowance and take live scores and fantasy scoring with it.
      #
      # Measured, not assumed: two pushes on 28 July 2026 triggered bakes at
      # 12:31 and 12:39, and a five-minute sample spanning one of them showed
      # 181 calls against an otherwise idle Worker.
      #
      # The hourly scheduled run through the 11:00-22:00 match window is
      # unchanged and remains the static fallback's real refresh.
      - name: Fetch live competition data
        if: github.event_name != 'push'
        run: npm run fetch:live
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_CLI: /tmp/squad-goals-api
          API_FOOTBALL_COMPETITIONS: "PL:2026,CL:2026"
      # Fantasy draft pool. This is BY FAR the most expensive step in the whole
      # workflow: it walks three seasons of paginated player statistics, measured
      # at 34 + 57 + 51 pages plus squads, roughly 180 upstream calls, against a
      # 7,500/day plan.
      #
      # The script has its own 24-hour freshness guard, and it does not fire
      # here. Observed on 28 July 2026: a bake at 12:39 re-fetched all 142 pages
      # despite the pool having been written at 08:38 the same morning, four
      # hours earlier. The guard reads the file's mtime, and the file only
      # exists in CI via the Actions cache, so its timestamp does not survive
      # the way the script assumes. Rather than depend on that, the hour gate
      # below is deterministic and cannot be defeated by cache semantics.
      #
      # Without it, ten scheduled bakes a day at 180 calls each is 1,800 calls,
      # a quarter of the daily allowance, spent re-reading three seasons of
      # history that by definition never change. Squad lists change daily at
      # most, so once a day at 11:00 UTC is the right cadence, and a manual run
      # still forces a refresh whenever the pool logic itself changes.
      - name: Fetch fantasy player pool
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "11" ]; then
            echo "Not the 11:00 UTC daily pool refresh, and not a manual run. Skipping."
            echo "The cached pool from the last refresh is used as-is."
            exit 0
          fi
          npm run fetch:fantasy-players
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_CLI: /tmp/squad-goals-api
          # The pool is cached across runs and guarded to one upstream refresh a
          # day, which is right for a squad list that barely changes. That guard
          # also blocks re-baking after a change to how the pool is built, so a
          # manual run can override it.
          FANTASY_REFRESH_HOURS: ${{ inputs.force_player_refresh && '0' || '' }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # PostHog stays dormant until both of these exist as repo secrets.
      # src/telemetry.js only calls posthog.init when it has a key AND a host, so
      # an unset secret ships a build that collects nothing rather than one that
      # throws. Vite inlines VITE_-prefixed vars at build time, which is why they
      # belong here rather than in the Worker: the key is a public write-only
      # ingest token, safe in a client bundle, unlike anything in wrangler.toml.
      - name: Build Svelte app
        run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
